name: freedom_music
description: Freedom Music for Android. Metadata is the source of truth.
publish_to: 'none'
version: 1.0.25+26

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  audio_metadata_reader: ^1.4.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  collection: ^1.19.1
  google_fonts: ^6.2.1
  file_picker: ^8.3.7
  archive: ^4.5.2
  audio_service: ^0.18.19
  http: ^1.6.0
  uuid: ^4.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
    - assets/secrets/yandex_oauth.json
